<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحضور الإلكتروني - NTU</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- QR Code Generator & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ntu: {
                            blue: '#0047AB',
                            red: '#D21F3C',
                            sky: '#00B7EB',
                            dark: '#0f172a',
                            light: '#ffffff'
                        }
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00B7EB; border-radius: 10px; }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #D21F3C;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration and Helpers
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBZfsS5xjUyunwIt_cHaPWHQI3H_lzYXoo",
            authDomain: "ntumlt.firebaseapp.com",
            projectId: "ntumlt",
            storageBucket: "ntumlt.firebasestorage.app",
            messagingSenderId: "658799327665",
            appId: "1:658799327665:web:8841af44d52aa7caa12590"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ntu-attendance-app';

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Mandatory Paths Rule Implementation
        const collections = {
            users: db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users'),
            attendance: db.collection('artifacts').doc(appId).collection('public').doc('data').collection('attendance')
        };

        const ADMIN_USER_HASH = "TlRV"; 
        const ADMIN_PASS_HASH = "TlRVX21sdDEyIzQ1QDU2";

        const SUBJECTS = [
            "طرائق البحث", "الحشرات طبية (نظري)", "الحشرات طبية (عملي)",
            "نشاطات لا صفية", "ساعة ارشاد", "الكيمياء الحياتية السريرية (نظري)",
            "الكيمياء الحياتية (عملي)", "الفطريات (نظري)", "الفطريات (عملي)",
            "امراض الدم (نظري)", "امراض الدم (عملي)", "اللغة الإنكليزية"
        ];

        const getTodayDate = () => new Date().toLocaleDateString('en-GB');
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const ThemeToggle = () => {
            const [isDark, setIsDark] = useState(false);
            useEffect(() => {
                isDark ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
            }, [isDark]);
            return (
                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-full bg-ntu-sky/20 hover:bg-ntu-sky/40 transition-all duration-300 absolute top-4 right-4 z-50">
                    {isDark ? "🌙" : "☀️"}
                </button>
            );
        };

        const Header = () => (
            <div className="text-center p-6 mb-4 relative">
                <h1 className="text-2xl font-bold text-ntu-blue dark:text-ntu-sky">Northern Technical University</h1>
                <h2 className="text-lg font-semibold text-ntu-red dark:text-red-400 mt-1">كلية التقنيات الصحية والطبية - كركوك</h2>
                <div className="w-24 h-1 bg-gradient-to-r from-ntu-blue via-ntu-red to-ntu-sky mx-auto mt-4 rounded-full"></div>
            </div>
        );

        const AuthScreen = ({ onLogin, authState }) => {
            const [mode, setMode] = useState('STUDENT');
            const [formData, setFormData] = useState({ name: '', pin: '', confirmPin: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleRegister = async () => {
                if (!authState) return setError("جاري الاتصال بالسيرفر...");
                if(!formData.name.trim() || !formData.pin.trim()) return setError("يرجى ملء كافة الحقول");
                if(formData.name.trim().split(' ').length < 3) return setError("يجب كتابة الاسم الثلاثي أو الرباعي");
                if(formData.pin !== formData.confirmPin) return setError("رمز الدخول غير متطابق");

                setLoading(true);
                try {
                    const snapshot = await collections.users.where('name', '==', formData.name.trim()).get();
                    if(!snapshot.empty) throw new Error("هذا الاسم مسجل مسبقاً");
                    const userId = generateId();
                    const userData = { name: formData.name.trim(), pin: formData.pin, role: 'student', stage: 'الثالثة', department: 'مختبرات طبية' };
                    await collections.users.doc(userId).set(userData);
                    localStorage.setItem('ntu_user', JSON.stringify({ uid: userId, ...userData }));
                    onLogin({ uid: userId, ...userData });
                } catch (err) { setError(err.message); }
                setLoading(false);
            };

            const handleStudentLogin = async () => {
                if (!authState) return setError("جاري الاتصال بالسيرفر...");
                setLoading(true);
                try {
                    const snap = await collections.users.where('name', '==', formData.name.trim()).where('pin', '==', formData.pin.trim()).get();
                    if(snap.empty) throw new Error("بيانات غير صحيحة");
                    const user = { uid: snap.docs[0].id, ...snap.docs[0].data() };
                    localStorage.setItem('ntu_user', JSON.stringify(user));
                    onLogin(user);
                } catch (err) { setError("خطأ في الاسم أو الرمز"); }
                setLoading(false);
            };

            const handleAdminLogin = () => {
                if(formData.name === atob(ADMIN_USER_HASH) && formData.pin === atob(ADMIN_PASS_HASH)) {
                    const admin = { uid: 'admin_001', role: 'admin', name: 'Admin NTU' };
                    localStorage.setItem('ntu_user', JSON.stringify(admin));
                    onLogin(admin);
                } else setError("بيانات المسؤول غير صحيحة");
            };

            return (
                <div className="glass-panel max-w-md mx-auto p-8 rounded-2xl shadow-2xl relative">
                    <h3 className="text-2xl font-bold text-center mb-6">{mode === 'ADMIN' ? 'بوابة المسؤول' : (mode === 'REGISTER' ? 'تسجيل جديد' : 'دخول الطالب')}</h3>
                    <div className="space-y-4">
                        <input type="text" placeholder="الاسم الكامل" className="w-full p-4 rounded-xl border dark:bg-gray-800" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                        <input type="password" placeholder="رمز الدخول" className="w-full p-4 rounded-xl border dark:bg-gray-800" value={formData.pin} onChange={e => setFormData({...formData, pin: e.target.value})} />
                        {mode === 'REGISTER' && <input type="password" placeholder="تأكيد الرمز" className="w-full p-4 rounded-xl border dark:bg-gray-800" value={formData.confirmPin} onChange={e => setFormData({...formData, confirmPin: e.target.value})} />}
                        {error && <p className="text-ntu-red text-center font-bold">{error}</p>}
                        <button onClick={mode === 'ADMIN' ? handleAdminLogin : (mode === 'REGISTER' ? handleRegister : handleStudentLogin)} className="w-full p-4 rounded-xl bg-ntu-blue text-white font-bold">
                            {loading ? <div className="loader mx-auto"></div> : 'متابعة'}
                        </button>
                    </div>
                    <div className="mt-6 flex justify-between text-sm">
                        {mode !== 'ADMIN' && <button onClick={() => setMode(mode === 'REGISTER' ? 'STUDENT' : 'REGISTER')} className="text-ntu-blue">{mode === 'REGISTER' ? 'دخول' : 'إنشاء حساب'}</button>}
                        <button onClick={() => setMode(mode === 'ADMIN' ? 'STUDENT' : 'ADMIN')} className="text-gray-500">{mode === 'ADMIN' ? 'دخول طالب' : '🗝️ مسؤول'}</button>
                    </div>
                </div>
            );
        };

        const StudentDashboard = ({ user, onLogout }) => {
            const qrRef = useRef(null);
            useEffect(() => {
                if(qrRef.current) {
                    qrRef.current.innerHTML = "";
                    new QRCode(qrRef.current, { text: JSON.stringify({ uid: user.uid, name: user.name }), width: 200, height: 200 });
                }
            }, [user]);

            return (
                <div className="max-w-2xl mx-auto p-4">
                    <div className="glass-panel p-6 rounded-3xl shadow-xl">
                        <div className="flex justify-between items-start mb-6">
                            <div><h2 className="text-2xl font-bold">{user.name}</h2><p>{user.stage} - {user.department}</p></div>
                            <button onClick={onLogout} className="text-ntu-red">خروج</button>
                        </div>
                        <div className="flex flex-col items-center bg-white p-6 rounded-2xl mb-4">
                            <div ref={qrRef} className="mb-4"></div>
                            <p className="text-gray-400">استخدم الرمز لتسجيل حضورك</p>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ onLogout }) => {
            const [view, setView] = useState('MAIN');
            const [members, setMembers] = useState([]);

            useEffect(() => {
                const unsub = collections.users.where('role', '==', 'student').onSnapshot(
                    snap => setMembers(snap.docs.map(d => ({id: d.id, ...d.data()}))),
                    err => console.error("Members Listener Error:", err)
                );
                return unsub;
            }, []);

            const renderContent = () => {
                switch(view) {
                    case 'MEMBERS': return <MembersList members={members} onBack={() => setView('MAIN')} />;
                    case 'ATTENDANCE': return <AttendanceLog subjects={SUBJECTS} onBack={() => setView('MAIN')} />;
                    case 'SCANNER': return <ScannerInterface subjects={SUBJECTS} onBack={() => setView('MAIN')} />;
                    default: return <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button onClick={() => setView('SCANNER')} className="glass-panel p-8 rounded-2xl">📷 تسجيل حضور</button>
                        <button onClick={() => setView('ATTENDANCE')} className="glass-panel p-8 rounded-2xl">📋 سجل الحضور</button>
                        <button onClick={() => setView('MEMBERS')} className="glass-panel p-8 rounded-2xl">👥 الطلاب</button>
                        <button onClick={onLogout} className="glass-panel p-8 rounded-2xl text-ntu-red">🚪 خروج</button>
                    </div>;
                }
            };
            return <div className="max-w-4xl mx-auto p-4">{renderContent()}</div>;
        };

        const MembersList = ({ members, onBack }) => (
            <div className="glass-panel p-6 rounded-2xl">
                <div className="flex justify-between mb-6"><h2 className="text-2xl font-bold">الطلاب ({members.length})</h2><button onClick={onBack}>رجوع</button></div>
                {members.map(m => <div key={m.id} className="p-4 mb-2 bg-white dark:bg-gray-800 rounded-xl flex justify-between items-center">
                    <div><p className="font-bold">{m.name}</p><p className="text-xs">{m.stage}</p></div>
                    <button onClick={() => collections.users.doc(m.id).delete()} className="text-ntu-red">حذف</button>
                </div>)}
            </div>
        );

        const AttendanceLog = ({ subjects, onBack }) => {
            const [subj, setSubj] = useState(subjects[0]);
            const [date, setDate] = useState(getTodayDate());
            const [recs, setRecs] = useState([]);

            useEffect(() => {
                return collections.attendance.where('subject', '==', subj).where('date', '==', date).onSnapshot(
                    s => setRecs(s.docs.map(d => ({id: d.id, ...d.data()}))),
                    err => console.error("Attendance Listener Error:", err)
                );
            }, [subj, date]);

            const download = () => {
                const csv = "الاسم,المادة,التاريخ\n" + recs.map(r => `${r.studentName},${r.subject},${r.date}`).join("\n");
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], {type: 'text/csv'}));
                link.download = `حضور_${subj}.csv`;
                link.click();
            };

            return (
                <div className="glass-panel p-6 rounded-2xl">
                    <div className="flex justify-between mb-4"><h2 className="font-bold">سجل الحضور</h2><button onClick={onBack}>رجوع</button></div>
                    <div className="flex gap-2 mb-4">
                        <select className="flex-1 p-2 border rounded" value={subj} onChange={e => setSubj(e.target.value)}>{subjects.map(s => <option key={s}>{s}</option>)}</select>
                        <input className="p-2 border rounded" value={date} onChange={e => setDate(e.target.value)} />
                    </div>
                    <button onClick={download} className="w-full bg-ntu-blue text-white p-2 rounded mb-4">تنزيل القائمة</button>
                    <table className="w-full text-right">
                        <thead><tr className="bg-gray-100"><th>الاسم</th><th>حذف</th></tr></thead>
                        <tbody>{recs.map(r => <tr key={r.id} className="border-b"><td>{r.studentName}</td><td><button onClick={() => collections.attendance.doc(r.id).delete()}>❌</button></td></tr>)}</tbody>
                    </table>
                </div>
            );
        };

        const ScannerInterface = ({ subjects, onBack }) => {
            const [subj, setSubj] = useState(subjects[0]);
            const [msg, setMsg] = useState('جاهز...');
            const scannerInstance = useRef(null);

            const record = async (uid, name) => {
                const today = getTodayDate();
                const check = await collections.attendance.where('studentId', '==', uid).where('subject', '==', subj).where('date', '==', today).get();
                if(!check.empty) return setMsg(`⚠️ مسجل مسبقاً: ${name}`);
                await collections.attendance.add({ 
                    studentId: uid, 
                    studentName: name, 
                    subject: subj, 
                    date: today, 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                });
                setMsg(`✅ تم: ${name}`);
            };

            useEffect(() => {
                const scanner = new Html5Qrcode("reader");
                scannerInstance.current = scanner;
                
                scanner.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: 250 }, 
                    (text) => {
                        try {
                            const data = JSON.parse(text);
                            if(data.uid) record(data.uid, data.name);
                        } catch(e) { setMsg("⚠️ خطأ في الكود"); }
                    },
                    (error) => { /* Ignore constant scanning errors */ }
                ).catch(err => {
                    setMsg("⚠️ الكاميرا مشغولة أو غير مسموح بها");
                });

                return () => {
                    if (scannerInstance.current) {
                        scannerInstance.current.stop().catch(err => console.warn("Scanner stop error", err));
                    }
                };
            }, [subj]);

            return (
                <div className="glass-panel p-6 rounded-2xl">
                    <div className="flex justify-between mb-4"><h2 className="font-bold">ماسح الحضور</h2><button onClick={onBack}>رجوع</button></div>
                    <select className="w-full p-3 border rounded mb-4" value={subj} onChange={e => setSubj(e.target.value)}>{subjects.map(s => <option key={s}>{s}</option>)}</select>
                    <div id="reader" className="overflow-hidden rounded-xl mb-4 bg-black" style={{ width: '100%', minHeight: '300px' }}></div>
                    <p className="text-center font-bold text-lg">{msg}</p>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authState, setAuthState] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // RULE 3: Auth Before Queries
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.error("Auth initialization failed:", err);
                    }
                };
                
                initAuth();

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setAuthState(u);
                    const saved = localStorage.getItem('ntu_user');
                    if(saved) setUser(JSON.parse(saved));
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex h-screen items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="pb-10">
                    <ThemeToggle />
                    <Header />
                    {!user ? (
                        <AuthScreen onLogin={setUser} authState={authState} />
                    ) : (
                        user.role === 'admin' ? 
                        <AdminDashboard onLogout={() => {localStorage.removeItem('ntu_user'); setUser(null);}} /> : 
                        <StudentDashboard user={user} onLogout={() => {localStorage.removeItem('ntu_user'); setUser(null);}} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
